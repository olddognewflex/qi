# tkt hybrid config for qi — SHARED markdown board + per-repo VCS/build.
# Board/state live under /Users/raymonddoran/Development/odnf/.sdlc/. Generated by _gen_configs.py.
# FOLDED IN from openkanban -> shared markdown board

[ticketing]
provider = "markdown"
project  = "QI"          # ticket key prefix on the shared board (QI-1, QI-2, ...)

[markdown]
board_dir = "/Users/raymonddoran/Development/odnf/.sdlc/board"   # SHARED across all ODNF repos
state_dir = "/Users/raymonddoran/Development/odnf/.sdlc/state"   # SHARED history + worklog sidecars
me        = "raymond"

[board.roles]
backlog     = "Backlog"
todo        = "To Do"
in_progress = "In Progress"
review      = "In Review"
done        = "Done"
blocked     = "Blocked"

[board.ownership]
"todo->in_progress"   = "agent"
"in_progress->review" = "agent"
"review->done"        = "agent"

[issue_types]
full_sdlc   = ["Story", "Bug"]
deliverable = ["Task", "Chore", "Spike"]

[queries]
all          = 'ORDER BY key ASC'   # every ticket on the board (used by tktban)
tier1        = 'status = "To Do" AND priority = "Highest" AND assignee = currentUser() ORDER BY priority DESC'
tier2        = 'status = "To Do" AND assignee = currentUser() ORDER BY priority DESC'
blocked      = 'status = "Blocked"'
deploy_ready = 'status = "Done"'

[timetracking]
provider = "local"

[vcs]
provider       = "github"
repo           = "olddognewflex/qi"
default_branch = "main"
branch_fmt     = "feature/{key-lower}-{slug}"
hotfix_fmt     = "hotfix/{key-lower}-{slug}"
reviewers      = []
merge          = "squash"

[build]
build     = "go build ./..."
test      = "go test ./..."
typecheck = "go vet ./..."
lint      = "gofmt -l ."
